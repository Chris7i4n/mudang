[package]
name = "gumiho-lsp"
version = "0.1.0"
publish = false
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
dashmap = "6"
lsp-types = "0.97"
lru = "0.16"
which = "7"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[lints.clippy]
ptr_arg = "deny"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
