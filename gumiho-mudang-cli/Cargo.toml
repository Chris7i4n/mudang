[package]
name = "gumiho-mudang-cli"
description = "User-facing CLI for gumiho-mudang. Binary: mudang."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "mudang"
path = "src/main.rs"

[dependencies]
gumiho-mudang-scope = { path = "../gumiho-mudang-scope" }
gumiho-mudang-lsp = { path = "../gumiho-mudang-lsp" }

# CLI
clap = { workspace = true }
clap_complete = { workspace = true }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Errors / logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Output / formatting
console = { workspace = true }
chrono = { workspace = true }

# Signal handling for long-running commands
ctrlc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
# Integration tests poke the SQLite graph directly.
rusqlite = { workspace = true }

[[test]]
name = "test_index"
path = "tests/integration/test_index.rs"

