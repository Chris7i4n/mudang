[workspace]
resolver = "2"
members = [
    "scope-audit-labeller-core",
    "scope-audit-labeller-noop",
    "scope-audit-labeller-llm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Christian Ferreira <christian.ferreir4@gmail.com>"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# HTTP transport for LLM-provider crates. Synchronous `ureq` keeps the
# labeller workspace tokio-free; line-by-line JSONL processing is
# naturally synchronous.
ureq = { version = "2", features = ["json"] }

# dev-deps
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
