[package]
name = "scope-core"
description = "Scope's foundation crate: tree-sitter parser, language plugins, Symbol/Edge types, project config."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Tree-sitter core
tree-sitter = { workspace = true }
streaming-iterator = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-ruby = { workspace = true }

# Serialisation (config)
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# R5 — framework version handling
semver = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# R1 CI gates: compile-fail tests for EdgeBuilder typestate and the
# absence of `.status(...)` (see CI-GATES.md § Builder requires fields,
# § Builder forbids status).
trybuild = "1.0"
