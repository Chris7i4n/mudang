[package]
name = "gumiho-mudang-scope"
description = "Syntactic engine for gumiho-mudang: tree-sitter parsing, per-language plugins, SQLite graph, and FTS5 search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "scope"
path = "src/main.rs"

[dependencies]
# CLI (still consumed by src/main.rs and src/commands/* during transitional phase)
clap = { workspace = true }
clap_complete = { workspace = true }

# Tree-sitter core
tree-sitter = { workspace = true }
streaming-iterator = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-ruby = { workspace = true }

# Storage
rusqlite = { workspace = true }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Parallelism
rayon = { workspace = true }

# Utilities
ignore = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console = { workspace = true }

# File watching
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }

