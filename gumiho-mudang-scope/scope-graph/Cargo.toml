[package]
name = "scope-graph"
description = "Scope's SQLite-backed dependency graph: schema, recursive queries (find_refs, find_impact, find_deps, find_call_paths, find_flow_paths)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Sibling sub-crates
scope-core = { path = "../scope-core" }

# Storage
rusqlite = { workspace = true }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# R8 — `Graph::check_audit_freshness` re-hashes source files
# referenced by the audit sample and compares against `file_hashes.hash`.
# Same crates the indexer uses to write that column (`scope-index`), so the
# re-hash on the audit side is byte-identical by construction.
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# R3 CI gate: compile-fail tests for `Insertable` typestate
# (see `docs/CI-GATES.md` § Insertable typestate).
trybuild = "1.0"
